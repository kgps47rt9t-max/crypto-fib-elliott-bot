name: Paper Trading Bot

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write   # Wichtig: erlaubt dem Bot, Dateien zurückzuschreiben

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot (single check)
        run: |
          python main.py --mode once

      - name: Commit updated state & logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain logs/) ]]; then
            git add logs/
            git commit -m "🤖 Bot update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No state changes to commit."
          fi